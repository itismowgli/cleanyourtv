# Claude reviews a pull request to this fork when the owner asks: comment "@claude review" on it.
#
# - Codex reviews every pull request on its own, using AGENTS.md and launcher/AGENTS.md, at no cost here.
#   This review is the deeper second look, so it runs only on request and uses the Claude plan only then.
# - Works for pull requests from other forks too: a comment runs in this repo, with its secrets.
# - Only the owner, members and collaborators can start it.
# - Review only: Claude can read the PR and comment, never push, approve, merge or close.
# - Runs on your Claude subscription: add CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) as a repo secret.
name: Claude review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # One review per PR at a time. Every other comment (a bot's, a person's) gets a group of its own, so it can
  # never cancel a review that is running.
  group: >-
    claude-review-${{ github.event.issue.number }}-${{
    !startsWith(github.event.comment.body, '@claude review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The base branch only, never the PR's code: Claude reads the PR through `gh pr diff`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Review this pull request to Readable Home, a fork of CleanYourTV whose launcher is restyled for
            reading from the sofa. Read AGENTS.md, launcher/AGENTS.md and docs/readable-home/README.md first;
            they are the rules. Codex has usually reviewed the PR already: read its comments and do not repeat
            them; look for what it missed.
            Read the PR with `gh pr view` and `gh pr diff`.

            Check, in this order, and only report what is actually wrong:
            1. Safety rules in AGENTS.md: no uninstalling, protected packages, the Home guard, no secrets,
               IP addresses or Wi-Fi names in files or screenshots.
            2. Launcher rules: no network, no new permissions or dependencies, minSdk 26, new behaviour off by
               default, and the APK size gate.
            3. Readable Home's design system: Inter only, no letter spacing, the five text sizes in
               res/values/type.xml, the 8dp grid and concentric corners.
            4. Bugs: D-pad focus from every edge, null handling, work on the main thread, memory on 1 GB TVs.
            5. One topic per PR, a "Tested on" line, and a screenshot from a real TV for any visual change.

            Put specific problems as inline comments on the lines. End with one short summary comment: a
            verdict (looks good / needs changes / needs a run on a real TV) and the reasons, in plain words.
            Do not praise, and do not repeat what the diff already says.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
